<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>活动业绩 · 营销日历 — EVIL ENERGY</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg-deep: #020a18;
      --bg-card: rgba(6,24,52,0.65);
      --border-subtle: rgba(0,184,255,0.12);
      --border-glow: rgba(0,184,255,0.28);
      --text-primary: #e0ecff;
      --text-secondary: #7ea8d9;
      --text-muted: rgba(126,168,217,0.45);
      --accent-cyan: #00e6ff;
      --accent-green: #00e6b8;
      --accent-orange: #ff9f43;
      --accent-pink: #ff6b9d;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      background:
        radial-gradient(ellipse 120% 60% at 50% 0%, rgba(0,110,200,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 80% 100%, rgba(0,184,255,0.08) 0%, transparent 60%),
        linear-gradient(180deg, #020a18 0%, #05102a 30%, #0a1a3a 70%, #061028 100%);
      color: var(--text-secondary); min-height: 100vh; overflow-x: hidden;
    }
    .container { position:relative; z-index:1; max-width:1320px; margin:0 auto; padding:24px 20px; }

    /* ── Top bar ── */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:28px; flex-wrap:wrap; gap:12px;
    }
    .topbar-left { display:flex; align-items:center; gap:14px; }
    .back-btn {
      display:inline-flex; align-items:center; gap:6px;
      background: rgba(8,40,80,0.6); border:1px solid rgba(0,184,255,0.2);
      color: var(--text-secondary); padding:7px 15px; border-radius:6px;
      cursor:pointer; text-decoration:none; font-size:13px;
      transition: all 0.25s;
    }
    .back-btn:hover { border-color: rgba(0,184,255,0.5); color:#fff; background:rgba(8,40,80,0.85); }
    .page-title {
      font-size:22px; font-weight:800; color:#fff; letter-spacing:1.5px;
      text-shadow: 0 0 30px rgba(0,184,255,0.3);
      display:flex; align-items:center; gap:10px;
    }
    .page-title .dot { width:8px; height:8px; background:var(--accent-cyan); border-radius:50%; box-shadow:0 0 10px rgba(0,230,255,0.6); }
    .status-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .badge {
      font-size:11px; padding:4px 12px; border-radius:14px;
      background:rgba(8,28,60,0.5); border:1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .badge.live { border-color: rgba(0,230,184,0.3); color: var(--accent-green); }
    .badge.live::before { content:''; display:inline-block; width:5px; height:5px; background:var(--accent-green); border-radius:50%; margin-right:6px; box-shadow:0 0 6px rgba(0,230,184,0.6); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Overview stats ── */
    .overview-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;
    }
    .ov-card {
      background: var(--bg-card); border:1px solid var(--border-subtle);
      border-radius:10px; padding:18px 20px; backdrop-filter:blur(10px);
      position:relative; overflow:hidden;
    }
    .ov-card::after {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background: linear-gradient(90deg, transparent, rgba(0,230,255,0.5), transparent);
      opacity:0.5;
    }
    .ov-label { font-size:11px; color:var(--text-muted); letter-spacing:1px; margin-bottom:8px; text-transform:uppercase; }
    .ov-value { font-size:26px; font-weight:800; color:#fff; font-family:'SF Mono',Monaco,monospace; }
    .ov-sub { font-size:11px; color:var(--text-muted); margin-top:4px; }
    .ov-accent { color:var(--accent-cyan); }
    .ov-green { color:var(--accent-green); }

    /* ── Gantt ── */
    .gantt-section { margin-bottom:24px; }
    .section-header {
      display:flex; align-items:center; gap:10px; margin-bottom:14px;
    }
    .section-header .line { width:3px; height:16px; background:var(--accent-cyan); border-radius:2px; }
    .section-header h2 { font-size:15px; color:#fff; font-weight:700; letter-spacing:1px; }
    .gantt-card {
      background: var(--bg-card); border:1px solid var(--border-subtle);
      border-radius:10px; padding:16px; backdrop-filter:blur(10px);
    }
    #ganttChart { width:100%; }

    /* ── Month tabs ── */
    .month-tabs-wrap { display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:4px; }
    .month-tab {
      flex-shrink:0; background:rgba(8,40,80,0.5); border:1px solid var(--border-subtle);
      color: var(--text-secondary); padding:10px 18px; border-radius:8px;
      cursor:pointer; font-size:13px; font-weight:600; transition:all 0.25s;
      white-space:nowrap; text-align:center;
    }
    .month-tab:hover { border-color:rgba(0,184,255,0.4); color:#fff; }
    .month-tab.active {
      background: linear-gradient(135deg, rgba(0,184,255,0.18), rgba(0,230,255,0.06));
      border-color: rgba(0,184,255,0.55); color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0,184,255,0.12);
    }
    .month-tab .mt-sub { font-size:10px; color:var(--text-muted); display:block; margin-top:2px; font-weight:400; }

    /* ── Campaign Cards ── */
    .campaign-grid {
      display:flex; flex-direction:column; gap:12px; margin-bottom:28px;
    }
    .cp-card {
      background: var(--bg-card); border:1px solid var(--border-subtle);
      border-radius:10px; padding:16px 22px; backdrop-filter:blur(10px);
      display:flex; align-items:center; gap:20px;
      position:relative; overflow:hidden;
      transition: all 0.3s;
    }
    .cp-card:hover { border-color: var(--border-glow); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,184,255,0.08); }
    .cp-card.active-card { border-color: rgba(0,230,184,0.3); }
    .cp-card.active-card::before {
      content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
      background:var(--accent-green); border-radius:0 2px 2px 0;
      box-shadow:0 0 10px rgba(0,230,184,0.4);
    }

    /* Info section (left) */
    .cp-info { flex:1; min-width:180px; }
    .cp-top { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
    .cp-name { font-size:15px; font-weight:750; color:#fff; }
    .cp-status {
      flex-shrink:0; font-size:10px; padding:2px 8px; border-radius:10px;
      letter-spacing:0.5px; font-weight:600;
    }
    .cp-status.active { background:rgba(0,230,184,0.12); color:var(--accent-green); border:1px solid rgba(0,230,184,0.25); }
    .cp-status.ended { background:rgba(126,168,217,0.06); color:var(--text-muted); border:1px solid rgba(126,168,217,0.15); }
    .cp-status.upcoming { background:rgba(255,159,67,0.08); color:var(--accent-orange); border:1px solid rgba(255,159,67,0.2); }
    .cp-theme { font-size:11px; color:var(--accent-cyan); opacity:0.7; margin-bottom:6px; }
    .cp-date-row { font-size:12px; color:var(--text-secondary); font-family:'SF Mono',Monaco,monospace; }
    .cp-date-row .arr { color:var(--accent-cyan); margin:0 6px; }
    .cp-meta { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
    .chip {
      font-size:10px; padding:2px 7px; border-radius:4px;
      background:rgba(0,184,255,0.05); border:1px solid rgba(0,184,255,0.08);
      color:var(--text-muted); white-space:nowrap;
    }

    /* KPI row (right) */
    .cp-kpis {
      display:flex; gap:16px; align-items:center; flex-shrink:0;
    }
    .cp-kpi {
      text-align:center; min-width:70px;
      padding:6px 10px; border-radius:6px;
      background:rgba(0,184,255,0.03); border:1px solid rgba(0,184,255,0.05);
    }
    .cp-kpi .kl { font-size:9px; color:var(--text-muted); letter-spacing:0.5px; margin-bottom:3px; }
    .cp-kpi .kv { font-size:13px; font-weight:700; color:#fff; font-family:'SF Mono',Monaco,monospace; }
    .cp-kpi .ks { font-size:9px; color:var(--text-muted); }
    .cp-kpi.rev .kv { color:var(--accent-cyan); }
    .cp-kpi.orders .kv { color:#fff; }

    .no-perf-data {
      color:var(--text-muted); font-size:12px; padding:8px 0;
      flex:1; text-align:right;
    }

    /* ── Table ── */
    .table-wrap {
      background:var(--bg-card); border:1px solid var(--border-subtle);
      border-radius:10px; padding:20px; backdrop-filter:blur(10px);
      overflow-x:auto;
    }
    .table-wrap .section-header { margin-bottom:14px; }
    table { width:100%; border-collapse:collapse; min-width:900px; }
    thead th {
      text-align:left; font-size:10px; color:var(--text-muted); letter-spacing:1px;
      padding:10px 8px; border-bottom:1px solid rgba(0,184,255,0.06); font-weight:500;
      white-space:nowrap;
    }
    thead th.ra { text-align:right; }
    tbody td {
      padding:10px 8px; font-size:12px; color:var(--text-secondary);
      border-bottom:1px solid rgba(0,184,255,0.03);
    }
    tbody td.ra { text-align:right; }
    tbody td.strong { color:#fff; font-weight:600; }
    tbody tr:hover td { background:rgba(0,184,255,0.03); }
    .t-status {
      display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600;
    }
    .t-active { background:rgba(0,230,184,0.1); color:var(--accent-green); }
    .t-ended { background:rgba(126,168,217,0.06); color:var(--text-muted); }
    .t-upcoming { background:rgba(255,159,67,0.08); color:var(--accent-orange); }

    /* ── Empty state ── */
    .empty { text-align:center; padding:80px 32px; }
    .empty-icon { font-size:42px; margin-bottom:12px; opacity:0.4; }
    .empty-title { font-size:17px; color:#fff; font-weight:600; margin-bottom:6px; }
    .empty-desc { font-size:12px; color:var(--text-muted); }

    /* ── Responsive ── */
    @media (max-width:768px) {
      .container { padding:16px 10px; }
      .overview-grid { grid-template-columns:repeat(2,1fr); }
      .campaign-grid { gap:10px; }
      .cp-card { flex-direction:column; align-items:flex-start; padding:16px; gap:12px; }
      .cp-kpis { flex-wrap:wrap; gap:8px; width:100%; }
      .cp-kpi { flex:1; min-width:60px; }
      .topbar { flex-direction:column; align-items:flex-start; }
      #ganttChart { min-height:180px; }
      .cp-name { font-size:15px; }
      .ov-value { font-size:22px; }
      .page-title { font-size:18px; }
    }
    @media (max-width:480px) {
      .overview-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
      .ov-card { padding:12px 14px; }
      .ov-value { font-size:20px; }
      .month-tab { padding:8px 12px; font-size:12px; }
      .kpi-bar .kv { font-size:14px; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="/evilenergy-sale-dashboard" class="back-btn">◂ 看板首页</a>
      <span class="page-title"><span class="dot"></span>活动业绩 · 营销日历</span>
    </div>
    <div class="status-bar">
      <span class="badge live" id="badgeLive" style="display:none"></span>
      <span class="badge" id="badgeUpdated">更新于 --</span>
    </div>
  </div>

  <!-- Overview Stats -->
  <div class="overview-grid" id="overviewStats"></div>

  <!-- Gantt Calendar -->
  <div class="gantt-section">
    <div class="section-header"><span class="line"></span><h2>营销活动日历 · Timeline</h2></div>
    <div class="gantt-card"><div id="ganttChart" style="height:240px"></div></div>
  </div>

  <!-- Month Tabs -->
  <div class="month-tabs-wrap" id="monthTabs"></div>

  <!-- Campaign Cards -->
  <div id="cpContent"></div>

  <!-- Comparison Table -->
  <div class="table-wrap" id="tableSection" style="display:none">
    <div class="section-header"><span class="line"></span><h2>全部活动业绩对比</h2></div>
    <table id="compareTable"></table>
  </div>
</div>

<script>
  let campaignData = null;
  let activeMonth = null;
  let ganttInst = null;

  function fmtUSD(v) {
    if (v == null || isNaN(v) || v === 0) return '--';
    return '$' + new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
  }
  function fmtNum(v) { return v == null || isNaN(v) ? '--' : new Intl.NumberFormat('en-US').format(v); }
  function fmtPct(v) { return v == null || isNaN(v) ? '--' : (v*100).toFixed(1)+'%'; }

  function getStatus(c) {
    if (c.status==='进行中'||c.status==='active') return 'active';
    if (c.status==='未开始'||c.status==='upcoming') return 'upcoming';
    return 'ended';
  }
  function getLabel(s) { return {active:'进行中',upcoming:'未开始',ended:'已完成'}[s]||s; }

  async function init() {
    try {
      const r = await fetch('campaign_data.json?t='+Date.now());
      if (r.ok) { campaignData = await r.json(); renderAll(); }
      else showEmpty('无法加载数据');
    } catch(e) { showEmpty('加载失败: '+e.message); }
  }

  function showEmpty(msg) {
    document.getElementById('cpContent').innerHTML = `<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">${msg}</div><div class="empty-desc">请运行 fetch_campaign_data.py 生成活动数据</div></div>`;
  }

  function renderAll() {
    const cs = campaignData.campaigns || [];
    const mg = campaignData.monthly_groups || {};
    document.getElementById('badgeUpdated').textContent = '更新于 ' + (campaignData.updated_at||'--');
    const actives = cs.filter(c => getStatus(c)==='active').length;
    if (actives > 0) {
      const bl = document.getElementById('badgeLive'); bl.style.display='inline-block';
      bl.textContent = '🔥 '+actives+' 个活动进行中';
    }
    renderOverview(cs);
    renderGantt(cs);
    renderMonthTabs(mg);
    renderTable(cs);
  }

  function renderOverview(cs) {
    const totalRev = cs.reduce((s,c)=>s+(c.revenue||0),0);
    const totalOrd = cs.reduce((s,c)=>s+(c.orders||0),0);
    const ended = cs.filter(c=>getStatus(c)==='ended');
    const avgAov = totalOrd>0 ? totalRev/totalOrd : 0;
    const avgDaily = ended.length>0 ? (ended.reduce((s,c)=>s+(c.daily_revenue||0),0)/ended.length) : 0;

    document.getElementById('overviewStats').innerHTML = `
      <div class="ov-card"><div class="ov-label">累计活动销售额</div><div class="ov-value ov-accent">${fmtUSD(totalRev)}</div><div class="ov-sub">${cs.length} 个活动</div></div>
      <div class="ov-card"><div class="ov-label">累计订单数</div><div class="ov-value">${fmtNum(totalOrd)}</div><div class="ov-sub">客单价 ${fmtUSD(avgAov)}</div></div>
      <div class="ov-card"><div class="ov-label">已完成活动</div><div class="ov-value ov-green">${ended.length}</div><div class="ov-sub">日均营收 ${fmtUSD(avgDaily)}</div></div>
      <div class="ov-card"><div class="ov-label">数据来源</div><div class="ov-value ov-accent">ShopifyQL</div><div class="ov-sub">与后台 Analytics 一致</div></div>`;
  }

  function renderGantt(cs) {
    const dom = document.getElementById('ganttChart');
    if (ganttInst) ganttInst.dispose();
    ganttInst = echarts.init(dom);
    const dated = cs.filter(c => c.start_date && c.end_date);
    if (!dated.length) { dom.style.height='60px'; dom.innerHTML='<div style="text-align:center;color:var(--text-muted);padding:20px">暂无带日期的活动</div>'; return; }

    dom.style.height = Math.max(200, dated.length*50 + 40) + 'px';

    const colors = { active: { fill:'rgba(0,230,184,0.55)', stroke:'rgba(0,230,184,0.8)' },
                     upcoming: { fill:'rgba(255,159,67,0.55)', stroke:'rgba(255,159,67,0.8)' },
                     ended: { fill:'rgba(0,184,255,0.25)', stroke:'rgba(0,184,255,0.4)' } };

    const ganttData = dated.map(c => {
      const s = getStatus(c); const col = colors[s] || colors.ended;
      return {
        name: c.name,
        value: [c.name, new Date(c.start_date).getTime(), new Date(c.end_date).getTime()],
        itemStyle: {
          color: new echarts.graphic.LinearGradient(0,0,1,0,[
            {offset:0, color:col.fill}, {offset:1, color:col.fill.replace('0.55','0.25').replace('0.25','0.08')}
          ]),
          borderRadius: [4,4,4,4],
          borderColor: col.stroke, borderWidth: s==='active'?1.5:0.8,
          shadowBlur: s==='active'?8:2, shadowColor: s==='active'?'rgba(0,230,184,0.3)':'transparent',
        },
        info: c,
      };
    });

    const opts = {
      backgroundColor:'transparent',
      grid:{top:8,right:30,bottom:16,left:140,containLabel:false},
      tooltip:{
        trigger:'item', backgroundColor:'rgba(4,16,40,0.95)', borderColor:'rgba(0,184,255,0.25)',
        textStyle:{color:'#9bbde8',fontSize:12},
        formatter:p=>{
          const d = p.data; if(!d||!d.info) return '';
          const c = d.info;
          return `<div style="font-size:13px;color:#fff;font-weight:700">${c.name}</div>
            <div style="font-size:11px;color:rgba(155,189,232,0.6);margin:4px 0">${c.theme||''}</div>
            <div style="font-size:11px;color:rgba(155,189,232,0.5)">📅 ${c.start_date} → ${c.end_date} · ${c.days||'?'}天</div>
            ${c.revenue>0?'<div style="font-size:12px;color:#00e6ff;margin-top:3px">💰 '+fmtUSD(c.revenue)+' · 📦 '+fmtNum(c.orders)+'单</div>':''}`;
        }
      },
      xAxis:{
        type:'time', axisLine:{lineStyle:{color:'rgba(155,189,232,0.08)'}},
        axisTick:{show:false}, axisLabel:{color:'rgba(155,189,232,0.3)',fontSize:10},
        splitLine:{lineStyle:{color:'rgba(155,189,232,0.03)'}},
      },
      yAxis:{
        type:'category', data:dated.map(c=>c.name),
        axisLine:{show:false}, axisTick:{show:false},
        axisLabel:{color:'#9bbde8',fontSize:11,width:130,overflow:'truncate'},
      },
      series:[{
        type:'bar', data:ganttData, barWidth:'55%',
        encode:{x:[1,2],y:0},
        label:{
          show:true, position:'right',
          formatter:p=>{
            const d = p.data; if(!d||!d.info||!d.info.revenue) return '';
            return fmtUSD(d.info.revenue);
          },
          fontSize:10, color:'rgba(255,255,255,0.7)',
          fontFamily:"'SF Mono',Monaco,monospace",
        },
      }],
    };
    ganttInst.setOption(opts);
    window.addEventListener('resize',()=>{if(ganttInst) ganttInst.resize();});
    ganttInst.resize();
  }

  function renderMonthTabs(monthly) {
    const tabs = document.getElementById('monthTabs');
    const entries = Object.entries(monthly);
    if (!entries.length) { tabs.style.display='none'; return; }
    const now = new Date().toISOString().slice(0,7);
    let sel = entries.find(([k])=>k===now) || entries[entries.length-1] || entries[0];
    activeMonth = sel[0];

    tabs.innerHTML = entries.map(([k,g])=>{
      const act = k===activeMonth;
      return `<div class="month-tab${act?' active':''}" onclick="pickMonth('${k}')">
        ${g.month_label}
        <span class="mt-sub">${g.total_revenue>0?fmtUSD(g.total_revenue):'待开始'} · ${g.campaigns.length}个活动</span>
      </div>`;
    }).join('');
    showMonthCards(activeMonth);
  }

  function pickMonth(k) {
    activeMonth = k;
    document.querySelectorAll('.month-tab').forEach(t=>t.classList.toggle('active',t.textContent.trim().startsWith(activeMonth.replace(/^\d{4}-/,'').replace(/^0/,'')+'月')));
    showMonthCards(k);
  }

  function showMonthCards(monthKey) {
    const mg = campaignData.monthly_groups||{};
    const group = mg[monthKey];
    const el = document.getElementById('cpContent');
    if (!group || !group.campaigns.length) { el.innerHTML='<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">该月暂无活动</div></div>'; return; }

    let html='';
    if (group.total_revenue>0) {
      html += `<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:12px 16px;background:rgba(0,184,255,0.04);border-radius:8px;border:1px solid rgba(0,184,255,0.08)">
        <span style="font-size:14px;color:#fff;font-weight:700">${group.month_label} 合计</span>
        <span style="font-size:20px;color:var(--accent-cyan);font-weight:800;font-family:monospace">${fmtUSD(group.total_revenue)}</span>
        <span style="font-size:12px;color:var(--text-muted)">${fmtNum(group.total_orders)}单 · 日均 ${fmtUSD(group.total_revenue/(group.campaigns.reduce((s,c)=>s+(c.days||30),0)/group.campaigns.length))}</span>
      </div>`;
    }
    html += '<div class="campaign-grid">';
    group.campaigns.forEach(c => {
      const st = getStatus(c);
      const has = c.revenue>0||c.orders>0;
      html += `<div class="cp-card${st==='active'?' active-card':''}">
        <div class="cp-info">
          <div class="cp-top">
            <span class="cp-name">${c.name}</span>
            <span class="cp-status ${st}">${getLabel(st)}</span>
          </div>
          <div class="cp-theme">${c.theme||''}</div>
          <div class="cp-date-row">
            <span>${c.start_date||'--'}</span>
            <span class="arr">→</span>
            <span>${c.end_date||'--'}</span>
          </div>
          <div class="cp-meta">
            <span class="chip">⏱ ${c.days||'--'}天</span>
            <span class="chip">⭐ ${c.level||'--'}</span>
            ${c.type?`<span class="chip">${c.type}</span>`:''}
          </div>
        </div>`;
      if (has) {
        html += `<div class="cp-kpis">
          <div class="cp-kpi rev"><div class="kl">Total Sales</div><div class="kv">${fmtUSD(c.revenue)}</div><div class="ks">日均${fmtUSD(c.daily_revenue)}</div></div>
          <div class="cp-kpi"><div class="kl">Net Sales</div><div class="kv">${fmtUSD(c.net_sales)}</div><div class="ks">AOV ${fmtUSD(c.aov)}</div></div>
          <div class="cp-kpi orders"><div class="kl">订单数</div><div class="kv">${fmtNum(c.orders)}</div><div class="ks">日均 ${c.daily_orders||'--'}单</div></div>
          <div class="cp-kpi"><div class="kl">新客率</div><div class="kv">${c.new_customer_rate||'--'}</div><div class="ks">新${fmtNum(c.new_customers)}回${fmtNum(c.returning_customers)}</div></div>
        </div>`;
      } else {
        html += '<div class="no-perf-data">⏳ 活动进行中/未开始，业绩数据待后续同步</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  function renderTable(cs) {
    const sec = document.getElementById('tableSection'); sec.style.display='block';
    const tb = document.getElementById('compareTable');
    let h=`<thead><tr>
      <th>活动</th><th>日期</th><th class="ra">销售额</th><th class="ra">净销售额</th><th class="ra">订单</th><th class="ra">客单价</th>
      <th class="ra">日均</th><th class="ra">新客</th><th class="ra">回头客</th><th class="ra">转化率</th><th class="ra">SKU</th><th>状态</th>
    </tr></thead><tbody>`;
    cs.forEach(c=>{
      const st=getStatus(c), has=c.revenue>0||c.orders>0;
      h+=`<tr>
        <td class="strong">${c.name}</td>
        <td style="font-size:10px;color:var(--text-muted)">${c.start_date||'--'} → ${c.end_date||'--'}</td>
        <td class="ra strong">${has?fmtUSD(c.revenue):'--'}</td>
        <td class="ra">${has?fmtUSD(c.net_sales):'--'}</td>
        <td class="ra">${has?fmtNum(c.orders):'--'}</td>
        <td class="ra">${has?fmtUSD(c.aov):'--'}</td>
        <td class="ra">${has?fmtUSD(c.daily_revenue):'--'}</td>
        <td class="ra">${has?fmtNum(c.new_customers):'--'}</td>
        <td class="ra">${has?fmtNum(c.returning_customers):'--'}</td>
        <td class="ra">${has?fmtPct(c.conversion_rate):'--'}</td>
        <td class="ra">${has?fmtNum(c.product_count):'--'}</td>
        <td><span class="t-status t-${st}">${getLabel(st)}</span></td>
      </tr>`;
    });
    h+='</tbody>'; tb.innerHTML=h;
  }

  init();
</script>
</body>
</html>
